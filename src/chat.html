<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saeed Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171923;color:#f4f5f7;font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:16px 18px;border-bottom:1px solid #ffffff18;font-weight:650;display:flex;justify-content:space-between}
#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.message{padding:10px 12px;border-radius:12px;max-width:88%;line-height:1.45;white-space:pre-wrap}.assistant{background:#292e3e;align-self:flex-start}.user{background:#315d8c;align-self:flex-end}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff18}textarea{flex:1;resize:none;max-height:140px;border:1px solid #ffffff2c;border-radius:10px;background:#222635;color:white;padding:11px;font:inherit}button{border:0;border-radius:9px;background:#5a83c4;color:white;padding:0 15px;cursor:pointer}
small{color:#9da7b9;padding:0 16px 10px}input,textarea,button{outline-offset:2px}button:disabled{opacity:.55;cursor:wait}
</style></head>
<body>
<header><span>Saeed · Chat</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="mic" type="button">Mic Off</button><button id="mute" type="button">Mute TTS</button><button id="brain-settings" type="button">Brain settings</button><button id="learning-toggle" type="button">Learning</button><button id="addons-toggle" type="button">Add-ons</button><button id="clear" type="button">Clear</button><button id="close" aria-label="Close chat">×</button></div></header>
<section id="provider-panel" hidden style="padding:12px 16px;border-bottom:1px solid #ffffff18;display:none;gap:8px;flex-direction:column">
<label>OpenAI-compatible endpoint<input id="endpoint" value="http://127.0.0.1:11434/v1/chat/completions" style="display:block;width:100%;box-sizing:border-box;padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px;margin-top:4px"></label>
<label>Model<input id="model" value="qwen2.5:3b" style="display:block;width:100%;box-sizing:border-box;padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px;margin-top:4px"></label>
<label>API key (optional for local Ollama)<input id="api-key" type="password" autocomplete="new-password" placeholder="Leave blank to keep current key" style="display:block;width:100%;box-sizing:border-box;padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px;margin-top:4px"></label>
<div style="display:flex;gap:8px"><button id="save-provider" type="button">Save provider</button><span id="provider-status" style="align-self:center;color:#aab3c5"></span></div>
</section>
<section id="addons-panel" hidden style="padding:12px 16px;border-bottom:1px solid #ffffff18;display:none;gap:8px;flex-direction:column;max-height:300px;overflow:auto">
<div style="display:flex;justify-content:space-between;align-items:center"><strong>Declarative add-ons</strong><button id="addons-close" type="button">Close add-ons</button></div>
<div class="muted">Skill-pack add-ons contain JSON data only; executable JavaScript plugins are not loaded. Enabled packs can be searched by Saeed through the registered tool interface.</div>
<div><button id="addons-import" type="button">Import skill-pack JSON…</button></div>
<div id="addons-status" class="muted"></div><div id="addons-list" style="display:flex;flex-direction:column;gap:6px"></div>
</section>
<section id="learning-panel" hidden style="padding:12px 16px;border-bottom:1px solid #ffffff18;display:none;gap:8px;flex-direction:column;max-height:320px;overflow:auto">
<div style="display:flex;justify-content:space-between;align-items:center"><strong>Saved skills and notes</strong><button id="learning-close" type="button">Close learning</button></div>
<input id="skill-title" maxlength="120" placeholder="Skill title" style="padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px">
<textarea id="skill-content" maxlength="8000" rows="3" placeholder="Instructions, useful knowledge, or a repeatable workflow…" style="padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px"></textarea>
<input id="skill-tags" placeholder="Tags separated by commas" style="padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px">
<div style="display:flex;gap:8px"><button id="skill-save" type="button">Save skill</button><button id="skill-reset" type="button">New</button><input id="skill-search" placeholder="Search saved skills…" style="flex:1;min-width:100px;padding:8px;background:#222635;color:white;border:1px solid #ffffff2c;border-radius:8px"></div>
<div id="skill-status" style="color:#aab3c5"></div><div id="skill-list" style="display:flex;flex-direction:column;gap:6px"></div>
</section>
<div id="messages" aria-live="polite"></div>
<small id="status">Mic is off by default. Brain starts only while Chat is open.</small>
<form id="form"><textarea id="input" rows="1" placeholder="Message Saeed…" required></textarea><button id="send" type="submit">Send</button></form>
<script src="./chat.js"></script>
</body></html>
