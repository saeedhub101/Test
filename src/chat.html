<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saeed AI — Chat</title><link rel="stylesheet" href="chat.css"></head>
<body><div class="app">
<header class="topbar"><div class="drag-region"><div class="brand-mark">S</div><div><div class="brand-name">Saeed AI</div><div id="connection" class="subtle">Ready</div></div></div><div class="top-actions"><button id="newChat" class="icon-btn no-drag" title="New conversation">＋</button><button id="deleteChat" class="icon-btn no-drag" title="Delete conversation">🗑</button><button id="openSettings" class="icon-btn no-drag" title="Settings">⚙</button><button id="minimize" class="icon-btn no-drag" title="Minimize">—</button><button id="close" class="icon-btn close no-drag" title="Close">×</button></div></header>
<div class="workspace"><aside class="history"><div class="history-head"><span>Conversations</span><button id="newChatSide" class="small-btn">New</button></div><div id="historyList" class="history-list"></div></aside>
<main class="chat-main"><section id="messages" class="messages"></section><div id="typing" class="typing hidden"><span></span><span></span><span></span><b>Saeed is working…</b></div>
<section class="composer-wrap"><div class="mode-row"><div class="mode-label"><span id="micDot" class="dot off"></span><span id="micLabel">Microphone Off</span></div><div class="mode-buttons"><button id="modeAlways">Always Listening</button><button id="modePush">Push to Talk</button><button id="modeOff" class="active">Mic Off</button></div></div><div class="composer"><button id="attach" class="tool-btn" title="Attach file">📎</button><button id="capture" class="tool-btn" title="Capture screen">▣</button><input id="attachment" type="file" hidden><textarea id="input" rows="1" placeholder="Message Saeed…"></textarea><button id="send" class="send-btn" title="Send">➤</button></div><div id="attachmentBar" class="attachment-bar hidden"></div><div class="hint">Enter to send · Shift+Enter for a new line · Attach files with 📎</div></section></main></div></div><script src="chat.js"></script></body></html>
