<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saeed</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: #fff; font: 12px system-ui, sans-serif; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    #toolbar { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; opacity: .18; transition: opacity .2s; -webkit-app-region: drag; }
    #toolbar:hover { opacity: 1; }
    button { -webkit-app-region: no-drag; border: 1px solid #ffffff55; border-radius: 7px; color: white; background: #141824cc; padding: 6px 9px; cursor: pointer; }
    #status { position: absolute; bottom: 8px; left: 8px; max-width: calc(100% - 16px); padding: 5px 8px; border-radius: 6px; background: #141824aa; color: #e6eaf2; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="toolbar"><span>Saeed</span><div><button id="chat">Chat</button> <button id="hide">Hide</button></div></div>
  <div id="status">Starting character engine…</div>
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js" } }
  </script>
  <script type="module" src="./character.js"></script>
</body>
</html>
