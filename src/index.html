<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Saeed AI</title><link rel="stylesheet" href="style.css"></head><body class="chatWindow"><section id="panel" class="visible chatShell">
<header class="chatHeader"><div class="brand"><div class="brandMark"><img src="../assets/saeed.png" alt="Saeed"></div><div class="brandText"><strong>Saeed</strong><small id="status">Ready</small></div></div><div class="headerRight"><span id="micBadge" class="micBadge off">MIC OFF</span><button id="togglePanel" title="Minimize">−</button><button id="clearChat" title="Clear conversation">Clear</button><button id="closeChat" title="Close">×</button></div></header>
<div class="hero"><div class="heroOrb">✦</div><div><span class="eyebrow">SAEED AI</span><h1>What should we get done?</h1><p>Your desktop companion for Windows, files, applications and everyday tasks.</p></div></div>
<div id="chatTabs" class="chatTabs"></div><main id="messages"><div class="welcome"><div class="suggestions"><button data-prompt="Open File Explorer">Open File Explorer</button><button data-prompt="Show my computer information">Computer info</button><button data-prompt="Check my computer health">Computer health</button><button data-prompt="What is the local time?">Local time</button></div></div></main>
<footer class="composer"><div id="attachments"></div><div class="composerRow"><button id="capture" class="toolBtn" title="Capture screen">⌗</button><textarea id="input" rows="1" placeholder="Tell Saeed what you want to do…"></textarea><button id="send" class="sendBtn" title="Send">➤</button></div><div class="composerHint">Enter to send · Shift+Enter for a new line</div></footer></section><script src="renderer.js"></script></body></html>
