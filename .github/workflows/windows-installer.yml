name: Windows Installer
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run syntax and functional tests
        run: npm run check
      - name: Build Windows installer without publishing (include source root)
        run: npm run dist:win
      - name: Smoke-test packaged app and bundled GLB
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "release/win-unpacked/Saeed.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged Saeed did not report a loaded character GLB within 45 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Saeed smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
