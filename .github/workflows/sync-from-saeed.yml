name: Sync from Saeed-V2.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-from-saeed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source repository exactly
        shell: bash
        run: |
          set -e
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git clone --depth 1 https://github.com/saeedhub101/Saeed-V2.0.git /tmp/saeed-v2
          find /tmp/saeed-v2 -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} . \;
          rm -f .github/workflows/build-windows-electron.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync from Saeed-V2.0 [sync-from-saeed]"
          git push --force origin main
