name: Phase 1 foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch and validate the real character asset
        run: npm run fetch:character
      - name: Trace deprecated dependency warnings
        shell: bash
        run: |
          for package in inflight rimraf glob boolean lodash.isequal punycode; do
            echo "::group::npm explain $package"
            npm explain "$package" || true
            echo "::endgroup::"
          done
      - name: Syntax and lifecycle tests
        run: npm run check
