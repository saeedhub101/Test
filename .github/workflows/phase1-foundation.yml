name: Phase 1 foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated npm lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Skipping lockfile commit because a newer main commit exists."
            exit 0
          fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Dependency lockfile is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add npm dependency lockfile"
          git push origin HEAD:main
      - name: Fetch and validate the real character asset
        run: npm run fetch:character
      - name: Syntax and lifecycle tests
        run: npm run check
